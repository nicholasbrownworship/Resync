name: Build Windows Installer

# Runs on GitHub's own Windows runner (not locally) so the NSIS
# installer gets built with real Windows tooling. Triggers:
#  - pushing a tag like v0.1.0  -> builds AND publishes to a Release
#  - manual "Run workflow" button in the Actions tab -> same thing
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build and publish installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
